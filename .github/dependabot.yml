# Opens PRs to keep dependencies current. Security fixes are raised as soon as advisories appear.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/migration-copilot"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
