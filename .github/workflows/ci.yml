# Runs on every pull request and every push to main.
# Branch protection requires these checks to pass before a PR can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Python lint (ruff, includes bandit security rules)
        run: ruff check --output-format=github .
      - name: Python formatting
        run: ruff format --check .
      - name: Shell scripts (shellcheck)
        run: shellcheck migration-copilot/scripts/*.sh
      - name: YAML (agents, OpenShift manifests, workflows)
        run: yamllint --strict .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: migration-copilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: migration-copilot/requirements*.txt
      - run: pip install -r requirements-local.txt
      - name: Demo runs end to end (demo mode, no credentials)
        run: python demo_local.py
      - name: Local chat loads every tool schema
        run: |
          python - <<'PY'
          import chat_local as c
          specs = list(c.tool_specs())
          assert len(specs) == 6, specs
          print("tools:", [n for n, _, _ in specs])
          PY
      - name: Approval guardrail still refuses unapproved migrations
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "tools")
          import openshift_tools as o
          r = o.start_migration.fn(plan_name="p", approver_name="", approval_confirmed=True)
          assert r["started"] is False, r
          r = o.start_migration.fn(plan_name="p", approver_name="Jane", approval_confirmed=False)
          assert r["started"] is False, r
          print("guardrail ok")
          PY
      - name: setup.sh syntax
        run: bash -n scripts/setup.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the full history of the PR
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        run: pip-audit -r migration-copilot/requirements-local.txt -r requirements-dev.txt
      - name: Leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Block PRs that add vulnerable or badly licensed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
