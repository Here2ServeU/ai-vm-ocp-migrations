<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 232 1664 920" width="1664" height="920" style="font-family:'IBM Plex Sans',Arial,sans-serif">
<title>AI Migration Copilot architecture</title>
<desc>Engineers, the approver and leadership use the Migration Copilot agent in watsonx Orchestrate. The agent discovers, assesses, plans, executes and reports on VMware to OpenShift migrations. Its model is watsonx.ai inside the agency boundary, or Anthropic Claude or OpenAI GPT through the Orchestrate AI gateway outside it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6B85"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8352B"/></marker>
<marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker></defs>
<rect x="128" y="232" width="1664" height="920" fill="#F6F7F9"/>
<rect x="130" y="234" width="1660" height="800" rx="20" fill="none" stroke="#5A6B85" stroke-width="2" stroke-dasharray="10 8"/>
<text x="158" y="280" font-size="22" fill="#5A6B85">AGENCY BOUNDARY · ON-PREMISES OR GOVERNMENT CLOUD</text>
<rect x="150" y="320" width="300" height="110" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="174" y="364" font-size="26" fill="#0F1B2D" font-weight="600">Engineer</text>
<text x="174" y="402" font-size="22" fill="#4A5568">asks, reviews</text>
<rect x="150" y="472" width="300" height="110" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="174" y="516" font-size="26" fill="#0F1B2D" font-weight="600">Approver</text>
<text x="174" y="554" font-size="22" fill="#4A5568">signs off waves</text>
<rect x="150" y="624" width="300" height="110" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="174" y="668" font-size="26" fill="#0F1B2D" font-weight="600">Leadership</text>
<text x="174" y="706" font-size="22" fill="#4A5568">gets reports</text>
<rect x="520" y="300" width="700" height="508" rx="18" fill="#EAF0FD" stroke="#2A5BD7" stroke-width="2.5"/>
<text x="544" y="346" font-size="26" fill="#2A5BD7" font-weight="600">watsonx Orchestrate</text>
<rect x="544" y="368" width="652" height="101" rx="12" fill="#2A5BD7" stroke="#2A5BD7" stroke-width="0"/>
<text x="568" y="410" font-size="28" fill="#F6F7F9" font-weight="600">Migration Copilot agent</text>
<text x="568" y="448" font-size="22" fill="#DCE6FF">plans, explains, asks for approval</text>
<rect x="544" y="479" width="652" height="53" rx="10" fill="#FDFDFE" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="514" font-size="24" fill="#0F1B2D" font-weight="600">Discover</text>
<text x="710" y="514" font-size="22" fill="#4A5568">read vCenter inventory</text>
<rect x="544" y="542" width="652" height="53" rx="10" fill="#FDFDFE" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="577" font-size="24" fill="#0F1B2D" font-weight="600">Assess</text>
<text x="710" y="577" font-size="22" fill="#4A5568">rate readiness, flag blockers</text>
<rect x="544" y="605" width="652" height="53" rx="10" fill="#FDFDFE" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="640" font-size="24" fill="#0F1B2D" font-weight="600">Plan</text>
<text x="710" y="640" font-size="22" fill="#4A5568">draft MTV wave plans (dry run)</text>
<rect x="544" y="668" width="652" height="53" rx="10" fill="#FDFDFE" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="703" font-size="24" fill="#0F1B2D" font-weight="600">Execute</text>
<text x="710" y="703" font-size="22" fill="#4A5568">start only after approval</text>
<rect x="544" y="731" width="652" height="53" rx="10" fill="#FDFDFE" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="766" font-size="24" fill="#0F1B2D" font-weight="600">Report</text>
<text x="710" y="766" font-size="22" fill="#4A5568">status and audit trail</text>
<!-- Model: pick one with scripts/setup.sh (llm option) -->
<rect x="520" y="832" width="700" height="176" rx="14" fill="#FDFDFE" stroke="#2A5BD7" stroke-width="1.5"/>
<text x="544" y="868" font-size="24" fill="#2A5BD7" font-weight="600">Model · pick one</text>
<text x="1196" y="868" font-size="20" fill="#4A5568" text-anchor="end">setup.sh --llm</text>
<rect x="544" y="886" width="318" height="100" rx="10" fill="#EAF0FD" stroke="#B9C9EE" stroke-width="1.5"/>
<text x="564" y="926" font-size="24" fill="#0F1B2D" font-weight="600">watsonx.ai</text>
<text x="564" y="960" font-size="20" fill="#4A5568">Granite · inside boundary</text>
<rect x="878" y="886" width="318" height="100" rx="10" fill="#FFFBF2" stroke="#B7791F" stroke-width="1.5"/>
<text x="898" y="926" font-size="24" fill="#0F1B2D" font-weight="600">AI gateway</text>
<text x="898" y="960" font-size="20" fill="#4A5568">forwards to external model</text>
<!-- External model APIs (outside the agency boundary) -->
<text x="158" y="1094" font-size="22" fill="#8A5A12">OUTSIDE THE BOUNDARY</text>
<text x="158" y="1124" font-size="20" fill="#8A5A12">optional · needs an API key</text>
<rect x="760" y="1066" width="262" height="68" rx="14" fill="#FFFBF2" stroke="#B7791F" stroke-width="2" stroke-dasharray="8 6"/>
<text x="784" y="1108" font-size="24" fill="#0F1B2D" font-weight="600">Anthropic · Claude</text>
<rect x="1042" y="1066" width="262" height="68" rx="14" fill="#FFFBF2" stroke="#B7791F" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1066" y="1108" font-size="24" fill="#0F1B2D" font-weight="600">OpenAI · GPT</text>
<text x="1330" y="1094" font-size="20" fill="#8A5A12">prompts and tool results</text>
<text x="1330" y="1122" font-size="20" fill="#8A5A12">are sent to the provider</text>
<path d="M1037 986 V1046 H891 V1064" fill="none" stroke="#B7791F" stroke-width="2" marker-end="url(#x)"/>
<path d="M1037 1046 H1173 V1064" fill="none" stroke="#B7791F" stroke-width="2" marker-end="url(#x)"/>
<!-- Right column: systems the tools touch -->
<rect x="1290" y="300" width="470" height="110" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="1314" y="344" font-size="26" fill="#0F1B2D" font-weight="600">VMware vSphere</text>
<text x="1314" y="382" font-size="22" fill="#4A5568">vCenter · source VMs</text>
<text x="1290" y="452" font-size="22" fill="#A62B22">VM data (copied by MTV)</text>
<rect x="1290" y="481" width="470" height="216" rx="14" fill="#FDF1F0" stroke="#C8352B" stroke-width="2.5"/>
<text x="1312" y="524" font-size="26" fill="#A62B22" font-weight="600">Red Hat OpenShift</text>
<rect x="1312" y="549" width="426" height="57" rx="14" fill="#FDFDFE" stroke="#E3B3AE" stroke-width="1.5"/>
<text x="1332" y="587" font-size="24" fill="#0F1B2D" font-weight="600">Migration Toolkit (MTV)</text>
<rect x="1312" y="618" width="426" height="57" rx="14" fill="#FDFDFE" stroke="#E3B3AE" stroke-width="1.5"/>
<text x="1332" y="656" font-size="24" fill="#0F1B2D" font-weight="600">OpenShift Virtualization</text>
<rect x="1290" y="717" width="470" height="61" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="1314" y="756" font-size="24" fill="#0F1B2D" font-weight="600">Inventory / CMDB · next step</text>
<rect x="1290" y="832" width="470" height="61" rx="14" fill="#FDFDFE" stroke="#0F1B2D" stroke-width="1.5"/>
<text x="1314" y="871" font-size="24" fill="#0F1B2D" font-weight="600">Audit log → SIEM</text>
<rect x="1290" y="913" width="470" height="80" rx="14" fill="#FDFDFE" stroke="#2A5BD7" stroke-width="1.5"/>
<text x="1314" y="947" font-size="24" fill="#0F1B2D" font-weight="600">watsonx.governance</text>
<text x="1314" y="977" font-size="20" fill="#4A5568">tracks the model's decisions</text>
